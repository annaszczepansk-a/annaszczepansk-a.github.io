<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Axon — logo „Sygnał” (wersja robocza do dopracowania): litera A + impuls w środku.
       Przezroczyste tło — kolor kafla ustawia desktop.js (bg). Kolory: #eaf1ff (litera), #7fb2ff → #3d6bff (sygnał). -->
  <defs>
    <linearGradient id="axon-sig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2ff"/>
      <stop offset="1" stop-color="#3d6bff"/>
    </linearGradient>
  </defs>
  <path d="M12 52 L32 12 L52 52" fill="none" stroke="#eaf1ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21 38 H29 l3 -5 l3 10 l3 -5 H43" fill="none" stroke="url(#axon-sig)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="12" r="4.5" fill="#7fb2ff"/>
</svg>
