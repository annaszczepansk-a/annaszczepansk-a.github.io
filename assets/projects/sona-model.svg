<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#101217"/>

  <text x="80" y="72" fill="#e0662e" font-size="12" letter-spacing="2.4" font-family="'Space Mono', ui-monospace, Menlo, monospace">MODEL ROZMOWY</text>
  <text x="80" y="106" fill="#f2f4f8" font-size="19" font-weight="500">Wątek jest przypięty do dnia — wiedza obejmuje cały dziennik</text>

  <!-- ===== DZIEŃ 21 (nieaktywny) ===== -->
  <rect x="80" y="180" width="288" height="430" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".13"/>
  <text x="104" y="216" fill="#c9cdd6" font-size="15" font-weight="500">21 cze</text>
  <text x="344" y="216" fill="#6f747f" font-size="12" text-anchor="end" font-family="'Space Mono', ui-monospace, Menlo, monospace">#12</text>
  <rect x="104" y="236" width="240" height="72" rx="8" fill="#ffffff" fill-opacity=".04"/>
  <text x="118" y="262" fill="#8a8f9a" font-size="12">Notatka dnia</text>
  <rect x="118" y="274" width="180" height="6" rx="3" fill="#ffffff" fill-opacity=".13"/>
  <rect x="118" y="288" width="140" height="6" rx="3" fill="#ffffff" fill-opacity=".09"/>
  <text x="104" y="342" fill="#6f747f" font-size="11" letter-spacing="1.4" font-family="'Space Mono', ui-monospace, Menlo, monospace">WĄTEK TEGO DNIA</text>
  <rect x="164" y="356" width="180" height="34" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <rect x="104" y="400" width="200" height="46" rx="10" fill="#ffffff" fill-opacity=".04"/>
  <rect x="184" y="456" width="160" height="34" rx="10" fill="#ffffff" fill-opacity=".07"/>

  <!-- ===== DZIEŃ 22 — OTWARTY ===== -->
  <rect x="392" y="180" width="288" height="430" rx="14" fill="#e0662e" fill-opacity=".10" stroke="#e0662e" stroke-opacity=".75" stroke-width="1.5"/>
  <text x="416" y="216" fill="#f2f4f8" font-size="15" font-weight="600">22 cze</text>
  <text x="656" y="216" fill="#e0662e" font-size="12" text-anchor="end" font-family="'Space Mono', ui-monospace, Menlo, monospace">DZIŚ</text>
  <rect x="416" y="236" width="240" height="72" rx="8" fill="#e0662e" fill-opacity=".08"/>
  <text x="430" y="262" fill="#f0a06a" font-size="12">Notatka dnia</text>
  <rect x="430" y="274" width="200" height="6" rx="3" fill="#f0a06a" fill-opacity=".55"/>
  <rect x="430" y="288" width="150" height="6" rx="3" fill="#f0a06a" fill-opacity=".35"/>
  <text x="416" y="342" fill="#e0662e" font-size="11" letter-spacing="1.4" font-family="'Space Mono', ui-monospace, Menlo, monospace">WĄTEK TEGO DNIA</text>
  <rect x="476" y="356" width="180" height="34" rx="10" fill="#e0662e" fill-opacity=".22"/>
  <text x="566" y="378" fill="#f2f4f8" font-size="12" text-anchor="middle">Czemu było ciężko?</text>
  <rect x="416" y="400" width="212" height="46" rx="10" fill="#ffffff" fill-opacity=".07"/>
  <text x="430" y="422" fill="#c9cdd6" font-size="12">Sona — odpowiada o tym</text>
  <text x="430" y="438" fill="#c9cdd6" font-size="12">dniu, pamięta poprzednie</text>
  <rect x="496" y="456" width="160" height="34" rx="10" fill="#e0662e" fill-opacity=".22"/>
  <rect x="416" y="502" width="240" height="40" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="436" y="527" fill="#8a8f9a" font-size="12">Porozmawiaj z Soną…</text>
  <circle cx="638" cy="522" r="10" fill="#e0662e"/>

  <!-- ===== DZIEŃ 23 (nieaktywny) ===== -->
  <rect x="704" y="180" width="288" height="430" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".13"/>
  <text x="728" y="216" fill="#c9cdd6" font-size="15" font-weight="500">23 cze</text>
  <text x="968" y="216" fill="#6f747f" font-size="12" text-anchor="end" font-family="'Space Mono', ui-monospace, Menlo, monospace">#14</text>
  <rect x="728" y="236" width="240" height="72" rx="8" fill="#ffffff" fill-opacity=".04"/>
  <text x="742" y="262" fill="#8a8f9a" font-size="12">Notatka dnia</text>
  <rect x="742" y="274" width="160" height="6" rx="3" fill="#ffffff" fill-opacity=".13"/>
  <text x="728" y="342" fill="#6f747f" font-size="11" letter-spacing="1.4" font-family="'Space Mono', ui-monospace, Menlo, monospace">WĄTEK TEGO DNIA</text>
  <rect x="728" y="356" width="240" height="60" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-dasharray="6 6"/>
  <text x="848" y="392" fill="#6f747f" font-size="12" text-anchor="middle">jeszcze pusty</text>

  <!-- ===== PAS: DZIENNIK ===== -->
  <rect x="80" y="700" width="912" height="96" rx="14" fill="#e0662e" fill-opacity=".07" stroke="#e0662e" stroke-opacity=".40"/>
  <text x="104" y="736" fill="#e0662e" font-size="11" letter-spacing="1.6" font-family="'Space Mono', ui-monospace, Menlo, monospace">KONTEKST MODELU — CAŁY DZIENNIK</text>
  <text x="104" y="768" fill="#c9cdd6" font-size="14">Wszystkie wpisy użytkowniczki: data · nastrój · treść. Pobierane po stronie serwera, ograniczone przez RLS.</text>

  <!-- strzałki kontekstu w górę -->
  <g stroke="#e0662e" stroke-opacity=".55" stroke-width="1.5" fill="none">
    <path d="M224,700 L224,626"/>
    <path d="M536,700 L536,626"/>
    <path d="M848,700 L848,626"/>
  </g>
  <g fill="#e0662e" fill-opacity=".75">
    <path d="M218,628 L230,628 L224,614 Z"/>
    <path d="M530,628 L542,628 L536,614 Z"/>
    <path d="M842,628 L854,628 L848,614 Z"/>
  </g>
  <text x="248" y="668" fill="#8a8f9a" font-size="12">ten sam kontekst trafia do każdego wątku</text>

  <!-- ===== LEGENDA ===== -->
  <rect x="1080" y="180" width="440" height="1" fill="#ffffff" fill-opacity=".13"/>

  <text x="1080" y="228" fill="#f2f4f8" font-size="17" font-weight="500">Wątek = dzień</text>
  <text x="1080" y="258" fill="#8a8f9a" font-size="14">Otwierasz dzień — widzisz jego notatkę</text>
  <text x="1080" y="280" fill="#8a8f9a" font-size="14">i rozmowę, która się przy nim toczyła.</text>
  <text x="1080" y="302" fill="#8a8f9a" font-size="14">Inny dzień to inna, czysta historia.</text>

  <text x="1080" y="366" fill="#f2f4f8" font-size="17" font-weight="500">Wiedza = całość</text>
  <text x="1080" y="396" fill="#8a8f9a" font-size="14">Sona zawsze ma w kontekście wszystkie</text>
  <text x="1080" y="418" fill="#8a8f9a" font-size="14">wpisy, więc „jak minął mi czerwiec?”</text>
  <text x="1080" y="440" fill="#8a8f9a" font-size="14">działa tak samo jak pytanie o dziś.</text>

  <text x="1080" y="504" fill="#f2f4f8" font-size="17" font-weight="500">Sona milczy pierwsza</text>
  <text x="1080" y="534" fill="#8a8f9a" font-size="14">Nie zaczyna rozmowy sama. Odzywa się</text>
  <text x="1080" y="556" fill="#8a8f9a" font-size="14">dopiero zapytana — zero presji</text>
  <text x="1080" y="578" fill="#8a8f9a" font-size="14">na prowadzenie dziennika.</text>

  <text x="1080" y="716" fill="#e0662e" font-size="12" letter-spacing="1.6" font-family="'Space Mono', ui-monospace, Menlo, monospace">DLACZEGO NIE JEDEN WĄTEK</text>
  <text x="1080" y="748" fill="#8a8f9a" font-size="14">Ciągły czat rośnie w nieskończoność</text>
  <text x="1080" y="770" fill="#8a8f9a" font-size="14">i gubi dzień. Wątek per dzień daje</text>
  <text x="1080" y="792" fill="#8a8f9a" font-size="14">„stronę dziennika z rozmową na marginesie”.</text>

  <text x="80" y="852" fill="#6f747f" font-size="12" font-family="'Space Mono', ui-monospace, Menlo, monospace" letter-spacing=".6">ROZMOWA NALEŻY DO DNIA, NIE DO SESJI — DZIENNIK ZOSTAJE DZIENNIKIEM, A NIE HISTORIĄ CZATU.</text>
</svg>
