<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1600" height="800" fill="#101217"/><text x="80" y="76" fill="#e0662e" font-size="15" font-family="'Space Mono', ui-monospace, Menlo, monospace" letter-spacing="3">ARCHITEKTURA</text><text x="80" y="132" fill="#f2efe9" font-size="34" font-weight="500">Dwa ekrany robocze: przeglądanie oddzielone od pisania</text><rect x="80" y="196" width="620" height="486" rx="20" fill="#15171d" stroke="#e0662e" stroke-opacity=".5"/><text x="116" y="252" fill="#e0662e" font-size="17" font-family="'Space Mono', ui-monospace, Menlo, monospace" letter-spacing="2.2">/ — DZIENNIK</text><text x="116" y="304" fill="#f2efe9" font-size="36" font-weight="500">Przegląd</text><text x="116" y="354" fill="#a8a39b" font-size="22">Powierzchnia wyłącznie do czytania —</text><text x="116" y="386" fill="#a8a39b" font-size="22">nic się tu nie pisze.</text><rect x="116" y="452" width="548" height="58" rx="12" fill="#1c1f26"/><text x="138" y="489" fill="#e8e5df" font-size="21">Pasek dni · dziś i 6 wstecz</text><rect x="116" y="526" width="548" height="58" rx="12" fill="#1c1f26"/><text x="138" y="563" fill="#e8e5df" font-size="21">Kalendarz miesiąca (rozwijany)</text><rect x="116" y="600" width="548" height="58" rx="12" fill="#1c1f26"/><text x="138" y="637" fill="#e8e5df" font-size="21">Feed dni · nastrój i zajawka</text><rect x="900" y="196" width="620" height="486" rx="20" fill="#15171d" stroke="#e0662e" stroke-opacity=".5"/><text x="936" y="252" fill="#e0662e" font-size="17" font-family="'Space Mono', ui-monospace, Menlo, monospace" letter-spacing="2.2">/WPIS — DZIEŃ</text><text x="936" y="304" fill="#f2efe9" font-size="36" font-weight="500">Praca</text><text x="936" y="354" fill="#a8a39b" font-size="22">Wszystko, co się pisze, nagrywa</text><text x="936" y="386" fill="#a8a39b" font-size="22">i kasuje — dzieje się tutaj.</text><rect x="936" y="452" width="548" height="58" rx="12" fill="#1c1f26"/><text x="958" y="489" fill="#e8e5df" font-size="21">Notatka dnia · auto-zapis</text><rect x="936" y="526" width="548" height="58" rx="12" fill="#1c1f26"/><text x="958" y="563" fill="#e8e5df" font-size="21">Nastrój · pięć twarzy</text><rect x="936" y="600" width="548" height="58" rx="12" fill="#2a1a12" stroke="#e0662e" stroke-opacity=".55"/><text x="958" y="637" fill="#e8e5df" font-size="21">Rozmowa z Soną · wątek dnia</text><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#e0662e"/></marker></defs><line x1="716" y1="368" x2="876" y2="368" stroke="#e0662e" stroke-width="2.5" marker-end="url(#ar)"/><text x="796" y="344" fill="#a8a39b" font-size="19" text-anchor="middle">klik w dzień</text><line x1="884" y1="520" x2="724" y2="520" stroke="#e0662e" stroke-width="2.5" marker-end="url(#ar)"/><text x="804" y="496" fill="#a8a39b" font-size="19" text-anchor="middle">powrót</text><text x="80" y="752" fill="#a8a39b" font-size="16" font-family="'Space Mono', ui-monospace, Menlo, monospace" letter-spacing="2.4">ŻADEN Z EKRANÓW NIE MUSI ROBIĆ OBU RZECZY NARAZ.</text><rect x="0.5" y="0.5" width="1599" height="799" fill="none" stroke="#ffffff" stroke-opacity=".12"/></svg>