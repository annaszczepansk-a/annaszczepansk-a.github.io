="translate(19.0,863.0) scale(0.7500)" fill="none" stroke="#8b857c" stroke-opacity="1.0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></g><g transform="translate(1549.0,33.0) scale(0.7500)" fill="none" stroke="#8b857c" stroke-opacity="1.0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></g><text x="576" y="150" fill="#8b857c" font-size="14.0" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="600">23 cze</text><text x="576" y="190.0" fill="#f2efe9" font-size="36.0" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="600">Wtorek</text><text x="576" y="218.0" fill="#8b857c" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500">#14</text><text x="604.0" y="218.0" fill="#8b857c" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">· </text><text x="614.0" y="218.0" fill="#e0662e" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">Dziś</text><text x="576" y="262.0" fill="#cbc7bf" font-size="16.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">Rano zdążyłam jeszcze przed wszystkimi — kawa, cisza i pół godziny</text><text x="576" y="288.0" fill="#cbc7bf" font-size="16.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">tylko dla siebie. Potem dzień się rozpędził i już nie zwolnił.</text><circle cx="598.0" cy="354.0" r="22.0" fill="none" stroke="#2a2a2e" stroke-width="1.0"/><g transform="translate(586.0,342.0) scale(0.7500)"><circle cx="16" cy="16" r="15" fill="#e0662e"/><g stroke="#161619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9 13.5 Q11.5 11 14 13.5"/><path d="M18 13.5 Q20.5 11 23 13.5"/><path d="M10 19 Q16 25 22 19"/></g></g><circle cx="646.0" cy="354.0" r="22.0" fill="#f2efe9"/><g transform="translate(634.0,342.0) scale(0.7500)"><circle cx="16" cy="16" r="15" fill="#e0662e"/><g stroke="#161619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9.8 13.4 Q11.7 11.7 13.6 13.4"/><path d="M18.4 13.4 Q20.3 11.7 22.2 13.4"/><path d="M11 18.5 Q16 23 21 19"/></g></g><circle cx="694.0" cy="354.0" r="22.0" fill="none" stroke="#2a2a2e" stroke-width="1.0"/><g transform="translate(682.0,342.0) scale(0.7500)"><circle cx="16" cy="16" r="15" fill="#e0662e"/><circle cx="11.5" cy="13.0" r="1.1" fill="#161619"/><circle cx="20.5" cy="13.0" r="1.1" fill="#161619"/><g stroke="#161619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M11 20 L21 20"/></g></g><circle cx="742.0" cy="354.0" r="22.0" fill="none" stroke="#2a2a2e" stroke-width="1.0"/><g transform="translate(730.0,342.0) scale(0.7500)"><circle cx="16" cy="16" r="15" fill="#e0662e"/><circle cx="11.5" cy="13.0" r="1.1" fill="#161619"/><circle cx="20.5" cy="13.0" r="1.1" fill="#161619"/><g stroke="#161619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M11 20.5 Q16 17.5 21 20.5"/></g></g><circle cx="790.0" cy="354.0" r="22.0" fill="none" stroke="#2a2a2e" stroke-width="1.0"/><g transform="translate(778.0,342.0) scale(0.7500)"><circle cx="16" cy="16" r="15" fill="#e0662e"/><g stroke="#161619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M9.5 12.5 Q11.5 14.5 13.5 12.5"/><path d="M18.5 12.5 Q20.5 14.5 22.5 12.5"/><path d="M10.5 21.5 Q16 15.5 21.5 21.5"/></g></g><rect x="747.8" y="414.0" width="276.2" height="42.0" rx="16.0" fill="#e0662e"/><text x="763.8" y="438.0" fill="#ffffff" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">Czemu ten dzień tak mnie zmęczył?</text><rect x="576.0" y="464.0" width="446.4" height="86.0" rx="16.0" fill="#1f1f23"/><text x="592.0" y="488.0" fill="#f2efe9" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">W poniedziałek i wtorek pisałaś o pracy do późna,</text><text x="592.0" y="510.0" fill="#f2efe9" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">a w obu wpisach wróciło słowo „cisza”. Może nie chodzi</text><text x="592.0" y="532.0" fill="#f2efe9" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">o samo zmęczenie, tylko o to, że dzień nie miał przerwy?</text><rect x="544" y="776.0" width="456.0" height="48.0" rx="24.0" fill="#1f1f23" stroke="#2a2a2e"/><text x="564.0" y="805.0" fill="#f2efe9" font-size="14.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400">A co z jutrem?</text><g transform="translate(968.0,792.0) scale(0.6667)" fill="none" stroke="#e0662e" stroke-opacity="1.0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></g><circle cx="1032.0" cy="800" r="24.0" fill="#e0662e"/><g transform="translate(1022.0,790.0) scale(0.8333)" fill="none" stroke="#ffffff" stroke-opacity="1.0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9.0" y="2.0" width="6.0" height="13.0" rx="3.0"/></g><rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#ffffff" stroke-opacity=".12"/></svg>